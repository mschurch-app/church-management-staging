<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#c94732"><title>講道 IG 與 YouTube 審核｜教會 OS</title><link rel="stylesheet" href="auth.css?v=20260923-aurora1"><link rel="stylesheet" href="church-brand.css?v=20261003-context1"><link rel="stylesheet" href="apple-ui.css?v=20261003-readable-report1"><link rel="stylesheet" href="church-palette.css?v=20261003-contrast1"><link rel="stylesheet" href="sermon-social-review.css?v=20261007-approval-submit1"></head><body><main class="member-page sermon-review-page"><header class="page-header"><div><p class="eyebrow">SERMON · PUBLISHING</p><h1>講道內容審核</h1><p id="stage" class="muted">正在載入審核資料…</p></div><a class="secondary" href="admin-dashboard.html?church=M%2B">管理首頁</a></header><p id="status" class="status-message" role="status"></p><section id="content" hidden><article class="review-card review-source"><div><span class="review-label">主日信息</span><h2 id="title"></h2><p id="meta"></p></div><a id="video" class="secondary" target="_blank" rel="noopener">觀看原始影片</a></article><article class="review-card artwork-review"><div><span class="review-label">INSTAGRAM 發布圖片</span><h2>選擇講道講員圖</h2><p class="muted">三張候選圖固定取自 1080p 原始影片：兩張膝蓋以上、一張半身，並套用 M+ 主日信息圖卡。構圖名稱只顯示在審查頁，不會印在發布圖片。</p></div><div id="artwork-options" class="artwork-options" role="radiogroup" aria-label="講道講員圖"></div></article><form id="form"><section class="review-card"><h2>基本資料</h2><div class="edit-grid"><label>講員<input id="speaker" maxlength="100"></label><label>經文<input id="scripture" maxlength="300"></label><label>講道開始秒數<input id="start" type="number" min="0"></label><label>講道結束秒數<input id="end" type="number" min="0"></label></div></section><section class="review-card"><h2>講道大綱</h2><div id="outline" class="review-list"></div></section><section class="review-card"><h2>重點內容</h2><div id="points" class="review-list"></div></section><section class="review-card"><h2>生活應用</h2><div id="applications" class="review-list"></div></section><section class="review-card"><h2>Instagram 貼文</h2><textarea id="caption" rows="10" maxlength="2200"></textarea></section><section class="review-card"><label>退回或補充意見<textarea id="comment" rows="3" maxlength="2000" placeholder="退回時必填"></textarea></label><div class="review-actions"><p id="approve-hint" role="status" aria-live="polite"></p><p id="action-status" role="status" aria-live="polite"></p><button id="save" type="button" class="secondary">儲存修改</button><button id="reject" type="button" class="secondary danger">退回修改</button><button id="approve" type="submit">IG 初審通過</button></div></section></form><section id="youtube" class="review-card youtube-workflow"><div class="subtitle-review-heading"><div><span class="review-label">YOUTUBE 獨立流程</span><h2>YouTube 影片與字幕</h2><p id="youtube-state" class="youtube-state">正在載入…</p><p id="youtube-edit-note" class="muted"></p></div><a id="subtitle-library-link" class="secondary" href="youtube-subtitle-library.html">校對本集詞庫</a></div><div id="youtube-controls" class="youtube-controls"><button id="youtube-full" type="button" class="secondary">保留完整直播</button><label>已剪除前段秒數<input id="youtube-offset" type="number" min="0" step="0.1"></label><button id="youtube-trimmed" type="button" class="secondary">確認已剪除講道前內容</button><button id="youtube-approve" type="button">確認上稿 YouTube 字幕</button></div><p id="subtitle-summary" class="muted">正在載入字幕…</p><div id="subtitle-preview" class="subtitle-preview" aria-label="字幕預覽"></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0/dist/umd/supabase.js"></script><script type="module" src="sermon-social-review.mjs?v=20261008-access-deadline1"></script><script type="module" src="church-brand.mjs?v=20261008-names1"></script></body></html>

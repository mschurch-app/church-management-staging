<script src="vendor/supabase-2.102.0.js"></script>
<script type="module">
import {wireLineAuth,pendingHandoff,safeAppTarget} from './app-line-auth.mjs?v=20261009-stage1';
(()=>{
  const AUTH_URL='https://aqanuwilmvdtlzuqlrau.supabase.co',KEY='sb_publishable_-on9uPxVvSaERBEpkoc_xg_CYuANexJ',STORAGE='church-staging-admin-v1';

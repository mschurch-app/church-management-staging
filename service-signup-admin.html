ption value="1">第 1 期｜1–2 月</option><option value="2">第 2 期｜3–4 月</option><option value="3">第 3 期｜5–6 月</option><option value="4">第 4 期｜7–8 月</option><option value="5">第 5 期｜9–10 月</option><option value="6">第 6 期｜11–12 月</option></select></label><button id="createPeriod">建立期別</button></div></details><section id="changePanel" class="change-panel" hidden></section><section id="smartPanel" class="smart-panel" hidden></section><section id="overview" class="overview"></section></main><script src="vendor/supabase-2.102.0.js"></script><script type="module" src="service-signup-admin.mjs?v=20261119-delegate1"></script><script type="module" src="church-brand.mjs?v=20261102-bibletree-admin1"></script></body></html>

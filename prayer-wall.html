<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>同心微光｜動態代禱牆</title><link rel="stylesheet" href="prayer-wall.css?v=20260923-2"></head>
<body><main id="wall" class="wall weather-calm">
  <header class="wall-head"><div class="brand"><span class="live-dot"></span><div><strong id="church-title">同心微光 · 動態代禱牆</strong><small id="connection">正在連接 LINE…</small></div></div><button id="create-open" class="fire-button">🔥 提出代禱</button></header>
  <section class="weather-card"><span id="weather-icon">◌</span><div><strong id="weather-label">台中 · 讀取此刻天氣</strong><small>背景會隨台中天氣變化；讀取失敗時使用柔和預設場景。</small></div></section>
  <section id="sky" class="prayer-sky" aria-live="polite"><div class="empty"><span>🕊️</span><strong>代禱微光準備中</strong><small>正在載入公開代禱事項</small></div></section>
  <footer class="wall-stats"><strong>🙏 今日同心代禱 <b id="total">0</b> 次</strong><span>光暈保留 3 小時 · 最多七層</span></footer>
</main>
<div id="sheet" class="sheet" hidden><button class="backdrop" data-close aria-label="關閉"></button><section><header><span>🙏</span><div><small id="detail-author"></small><strong id="detail-title"></strong></div><button data-close aria-label="關閉">×</button></header><p id="detail-content" class="detail-content"></p><div id="joined" class="joined"></div><p class="guide">也想留下文字陪伴對方嗎？</p><button id="watch-open" class="watch-open"><b>✍️ 寫下守望禱告</b><small>選填 · 送出後會增加一個繞行光點</small></button><form id="watch-form" hidden><textarea id="watch-text" maxlength="300" required placeholder="主啊，求你賜下平安、智慧與力量……"></textarea><p>公開文字會顯示於代禱牆，請避免填寫電話、地址等個人資料。</p><button>送出守望禱告</button></form><div id="comments" class="comments"></div><p id="sheet-status" role="status"></p></section></div>
<div id="create" class="sheet" hidden><button class="backdrop" data-create-close aria-label="關閉"></button><section><header><span>🔥</span><div><small>七天守望</small><strong>提出代禱事項</strong></div><button data-create-close aria-label="關閉">×</button></header><form id="create-form"><label>代禱主題<input id="new-title" maxlength="80" required placeholder="例如：家人手術平安"></label><label>具體代禱內容<textarea id="new-content" maxlength="1000" required placeholder="寫下需要，讓弟兄姊妹一起托住你……"></textarea></label><fieldset><legend>公開範圍</legend><label><input type="radio" name="privacy" value="public" checked> 公開在代禱牆</label><label><input type="radio" name="privacy" value="private"> 僅教牧同工可見</label></fieldset><button>送上代禱</button><p id="create-status" role="status"></p></form></section></div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0/dist/umd/supabase.js"></script><script type="module" src="prayer-wall.mjs?v=20260923-2"></script></body></html>

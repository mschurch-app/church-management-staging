  <script type="module">
    import {lineConfig, LINE_MEMBER_ENDPOINT} from './line-config.mjs?v=20260923-today1';

    const todayVerse = '你們心裡不要憂愁；你們信神，也當信我。';
    const todayVerseReference = '約翰福音 14:1';
    const todayPrayer = '願上帝的平安今天溫柔環繞你，在每一個選擇裡賜下清楚的方向，也讓你知道：你從未獨自前行。';

    const params = new URLSearchParams(location.search);
    const church = ['M+', 'SHiNE'].includes(params.get('church')) ? params.get('church') : '';
    const brandNames = {'M+':'M＋大雅教會', SHiNE:'火樂教會'};
    let liveVerse = todayVerse;
    let liveVerseReference = todayVerseReference;
    let livePrayer = todayPrayer;
    let profileName = '主內家人';
    let LIFF_ID = params.get('liffId') || '';

    const $ = selector => document.querySelector(selector);
    const envelopeButton = $('#envelopeButton');
    const giftStage = $('#giftStage');
    const revealStage = $('#revealStage');
    const graceCard = $('#graceCard');
    const speakButton = $('#speakButton');
    const receiveButton = $('#receiveButton');
    const shareButton = $('#shareButton');
    const shareDialog = $('#shareDialog');
    const sharePreview = $('#sharePreview');
    const closeShareDialog = $('#closeShareDialog');
    const changeBackgroundButton = $('#changeBackgroundButton');
    const downloadCardButton = $('#downloadCardButton');
    const sendCardButton = $('#sendCardButton');
    envelopeButton.disabled = true;
    let hasRevealed = false;
    let liffReady = false;
    let toastTimer = 0;
    let speechParts = [];
    let speechPartIndex = 0;
    let activeUtterance = null;
    let speechStartTimer = 0;
    let speechKeepAliveTimer = 0;
    let speechRetryCount = 0;
    let speechCurrentStarted = false;
    let currentTheme = -1;
    let cardAnimationFrame = 0;
    const cardThemes = [
      ['#55c8f2','#ffe16a','#ffb36d','#fff9df'],['#79d5bd','#d7f28a','#ffc078','#fffce8'],['#65bdf5','#8de2d2','#ffd86f','#fff8df'],['#ffb9a5','#ffe27d','#ffb66e','#fff8e6'],
      ['#a9d879','#ffe37a','#ffc28b','#fffbea'],['#72d6e8','#b6ecb4','#ffd36e','#fff9e4'],['#ffcf70','#ff9f82','#ffe496','#fff8e8'],['#83cafa','#c7e88a','#ffbf7f','#fffbea'],
      ['#f6a9c6','#ffd96f','#ffb985','#fff8e7'],['#65d1b6','#9ee3e9','#ffe079','#fffbea'],['#9acbff','#c1e694','#ffd189','#fff8e7'],['#ffd06b','#ffad9a','#a9e7d2','#fffbea'],
      ['#83d9c0','#ffe28a','#f9a9b5','#fff9e5'],['#79c9f5','#ffc57d','#ffe68c','#fffbea'],['#c5df78','#77d9c8','#ffd27c','#fff9e6'],['#ffad87','#ffd978','#92d7f3','#fffbea'],
      ['#69c9e9','#ffe08a','#ffae83','#fff9e2'],['#9ddc87','#8bd9ed','#ffcf72','#fffbea'],['#ffd078','#ff9fab','#83d8c3','#fff8e6'],['#76d5be','#b9e589','#ffd17b','#fffbea']
    ];
    const cardLogo = new Image();
    cardLogo.src = church === 'SHiNE' ? 'assets/brands/shine-logo.png' : 'assets/brands/mplus-logo-white.png';

    function createParticles() {
      const area = $('#particles');
      for (let i = 0; i < 24; i += 1) {
        const dot = document.createElement('i');
        const size = 2 + Math.random() * 5;
        dot.className = 'particle';
        dot.style.left = `${Math.random() * 100}vw`;
        dot.style.top = `${Math.random() * 100}vh`;
        dot.style.setProperty('--size', `${size}px`);
        dot.style.setProperty('--duration', `${4 + Math.random() * 8}s`);
        dot.style.setProperty('--delay', `${-Math.random() * 8}s`);
        dot.style.setProperty('--dx', `${-24 + Math.random() * 48}px`);
        dot.style.setProperty('--dy', `${-30 + Math.random() * 60}px`);
        area.append(dot);
      }
    }

    function todayLabel() {
      const now = new Date();
      const date = new Intl.DateTimeFormat('zh-TW', { month: 'long', day: 'numeric' }).format(now);
      const hour = now.getHours();
      const light = hour < 11 ? '晨光' : hour < 17 ? '日光' : '晚霞';
      return `${date} ${light}`;
    }

    function showToast(message) {
      const toast = $('#toast');
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add('show');
      toastTimer = window.setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function celebrateReveal() {
      if (typeof window.confetti !== 'function') return;
      const defaults = { origin: { y: .55 }, disableForReducedMotion: true, zIndex: 70 };
      window.confetti({ ...defaults, particleCount: 65, spread: 68, startVelocity: 34, colors: ['#f8d477','#e8a94f','#fff7d6','#9eb986'] });
      window.setTimeout(() => window.confetti({ ...defaults, particleCount: 38, spread: 105, startVelocity: 24, scalar: .82, colors: ['#f4bf5d','#fff2b6','#ed9371'] }), 170);
    }

    function typeText(element, value, speed = 46) {
      element.textContent = '';
      element.classList.remove('done');
      return new Promise(resolve => {
        let index = 0;
        const write = () => {
          const character = document.createElement('span');
          character.className = 'written-char';
          character.textContent = value[index] || '';
          element.append(character);
          index += 1;
          if (index < value.length) window.setTimeout(write, speed);
          else { element.classList.add('done'); resolve(); }
        };
        write();
      });
    }

    function revealInSequence() {
      $('#todayDate').textContent = todayLabel();
      $('#verseReference').textContent = `— ${liveVerseReference}`;
      $('#prayerText').textContent = livePrayer;
      const items = [$('#cardHeader'), ...document.querySelectorAll('[data-reveal]')];
      items.forEach((item, index) => window.setTimeout(() => item.classList.add('show'), 180 + index * 230));
      window.setTimeout(() => typeText($('#verseText'), `「${liveVerse}」`, 52), 760);
    }

    function revealGrace() {
      if (hasRevealed) return;
      hasRevealed = true;
      navigator.vibrate?.([32, 42, 56]);
      celebrateReveal();
      envelopeButton.classList.add('opening');
      window.setTimeout(() => {
        giftStage.classList.add('hidden');
        revealStage.classList.remove('hidden');
        revealStage.classList.add('flex');
        requestAnimationFrame(() => requestAnimationFrame(() => graceCard.classList.add('revealed')));
        revealInSequence();
      }, 520);
    }

    function stopSpeaking() {
      clearTimeout(speechStartTimer);
      clearInterval(speechKeepAliveTimer);
      speechStartTimer = 0;
      speechKeepAliveTimer = 0;
      activeUtterance = null;
      speechParts = [];
      speechPartIndex = 0;
      speechCurrentStarted = false;
      window.speechSynthesis?.cancel();
      $('#speakWave').classList.add('hidden');
      $('#speakerIcon').classList.remove('hidden');
      $('#speakerLabel').textContent = '朗讀';
      speakButton.dataset.speaking = 'false';
      speakButton.disabled = false;
    }

    function chineseVoice() {
      const voices = window.speechSynthesis.getVoices();
      return voices.find(voice => /^zh-TW/i.test(voice.lang))
        || voices.find(voice => /^zh-(HK|CN)/i.test(voice.lang))
        || voices.find(voice => /^zh/i.test(voice.lang))
        || null;
    }

    function updateSpeakingUi(started = true) {
      $('#speakerIcon').classList.toggle('hidden', started);
      $('#speakWave').classList.toggle('hidden', !started);
      $('#speakerLabel').textContent = started ? '停止' : '準備中';
      speakButton.dataset.speaking = 'true';
    }

    function speakNextPart() {
      if (speakButton.dataset.speaking !== 'true') return;
      if (speechPartIndex >= speechParts.length) {
        stopSpeaking();
        return;
      }

      const utterance = new SpeechSynthesisUtterance(speechParts[speechPartIndex]);
      utterance.lang = 'zh-TW';
      utterance.rate = .88;
      utterance.pitch = 1.03;
      utterance.volume = 1;
      utterance.voice = chineseVoice();
      activeUtterance = utterance; // iOS/WKWebView 必須保留參照，避免朗讀物件被提早回收。
      speechCurrentStarted = false;

      utterance.onstart = () => {
        clearTimeout(speechStartTimer);
        speechCurrentStarted = true;
        speechRetryCount = 0;
        updateSpeakingUi(true);
      };
      utterance.onend = () => {
        clearTimeout(speechStartTimer);
        speechPartIndex += 1;
        activeUtterance = null;
        window.setTimeout(speakNextPart, 90);
      };
      utterance.onerror = event => {
        clearTimeout(speechStartTimer);
        if (event.error === 'interrupted' || event.error === 'canceled') return;
        stopSpeaking();
        showToast('朗讀未能啟動，請確認手機音量後再試一次');
      };

      window.speechSynthesis.resume();
      window.speechSynthesis.speak(utterance);
      speechStartTimer = window.setTimeout(() => {
        if (speechCurrentStarted || !activeUtterance) return;
        if (speechRetryCount < 1) {
          speechRetryCount += 1;
          window.speechSynthesis.cancel();
          activeUtterance = null;
          window.setTimeout(speakNextPart, 120);
          return;
        }
        stopSpeaking();
        showToast('LINE 暫時無法啟動朗讀，請調高媒體音量後再試');
      }, 1800);
    }

    function chineseNumber(value) {
      const digits = ['零','一','二','三','四','五','六','七','八','九'];
      const number = Number(value);
      if (!Number.isFinite(number) || number < 0 || number > 999) return String(value);
      if (number < 10) return digits[number];
      if (number < 20) return `十${number % 10 ? digits[number % 10] : ''}`;
      if (number < 100) return `${digits[Math.floor(number / 10)]}十${number % 10 ? digits[number % 10] : ''}`;
      const rest = number % 100;
      return `${digits[Math.floor(number / 100)]}百${rest ? (rest < 10 ? '零' : '') + chineseNumber(rest) : ''}`;
    }

    function speechFriendlyReference(reference) {
      return String(reference || '')
        .replace(/(\d+)\s*[:：]\s*(\d+)(?:\s*[-–—~～]\s*(\d+))?/g, (_, chapter, verse, through) =>
          `${chineseNumber(chapter)}章${chineseNumber(verse)}節${through ? `到${chineseNumber(through)}節` : ''}`
        )
        .replace(/(\d+)\s*章/g, (_, chapter) => `${chineseNumber(chapter)}章`);
    }

    function speakGrace() {
      if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
        showToast('此瀏覽器暫不支援語音朗讀');
        return;
      }
      if (speakButton.dataset.speaking === 'true') {
        stopSpeaking();
        return;
      }

      window.speechSynthesis.cancel();
      speechParts = [
        `今日應許。${liveVerse}`,
        speechFriendlyReference(liveVerseReference),
        `祝福你。${livePrayer}`
      ].filter(Boolean);
      speechPartIndex = 0;
      speechRetryCount = 0;
      updateSpeakingUi(false);

      // iOS LINE WebView 偶爾會把語音佇列暫停；週期性 resume 可避免無聲卡住。
      speechKeepAliveTimer = window.setInterval(() => {
        if (speakButton.dataset.speaking === 'true' && window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
        }
      }, 700);

      // 先在點擊手勢內建立佇列，再等一個 frame 讓 cancel 完成。
      window.requestAnimationFrame(speakNextPart);
    }

    function releaseHearts(button) {
      const rect = button.getBoundingClientRect();
      for (let i = 0; i < 14; i += 1) {
        const heart = document.createElement('span');
        heart.className = 'heart-spark';
        heart.textContent = i % 4 === 0 ? '✨' : '💖';
        heart.style.left = `${rect.left + rect.width / 2}px`;
        heart.style.top = `${rect.top + rect.height / 2}px`;
        heart.style.setProperty('--x', `${-90 + Math.random() * 180}px`);
        heart.style.setProperty('--y', `${-35 + Math.random() * 70}px`);
        heart.style.setProperty('--r', `${-55 + Math.random() * 110}deg`);
        heart.style.fontSize = `${12 + Math.random() * 12}px`;
        heart.style.animationDelay = `${Math.random() * .12}s`;
        document.body.append(heart);
        window.setTimeout(() => heart.remove(), 1400);
      }
    }

    function roundRect(ctx, x, y, width, height, radius) {
      const r=Math.min(radius,width/2,height/2);
      ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+width,y,x+width,y+height,r);ctx.arcTo(x+width,y+height,x,y+height,r);ctx.arcTo(x,y+height,x,y,r);ctx.arcTo(x,y,x+width,y,r);ctx.closePath();ctx.fill();
    }

    function drawLeaf(ctx, x, y, scale, rotation, color) {
      ctx.save(); ctx.translate(x,y); ctx.rotate(rotation); ctx.fillStyle=color;
      ctx.beginPath(); ctx.ellipse(0,0,20*scale,54*scale,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.44)';ctx.lineWidth=2*scale;ctx.beginPath();ctx.moveTo(0,42*scale);ctx.quadraticCurveTo(2*scale,0,0,-42*scale);ctx.stroke();ctx.restore();
    }

    function drawCloud(ctx,x,y,scale,opacity=.78){ctx.save();ctx.globalAlpha=opacity;ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(x,y,64*scale,23*scale,0,0,Math.PI*2);ctx.ellipse(x-35*scale,y+4*scale,34*scale,19*scale,0,0,Math.PI*2);ctx.ellipse(x+27*scale,y-12*scale,39*scale,30*scale,0,0,Math.PI*2);ctx.fill();ctx.restore();}

    function drawHill(ctx, color, y, amplitude, phase) {
      ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,1200);ctx.lineTo(0,y);
      for(let x=0;x<=900;x+=30){const wave=Math.sin((x/900*Math.PI*2)+phase)*amplitude+Math.sin((x/900*Math.PI*4)+phase*.7)*amplitude*.22;ctx.lineTo(x,y+wave);}
      ctx.lineTo(900,1200);ctx.closePath();ctx.fill();
    }

    function drawFlower(ctx,x,y,scale,color){ctx.save();ctx.translate(x,y);ctx.strokeStyle='rgba(48,123,81,.72)';ctx.lineWidth=4*scale;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(-5*scale,-25*scale,0,-47*scale);ctx.stroke();ctx.fillStyle='rgba(81,173,112,.78)';ctx.beginPath();ctx.ellipse(-9*scale,-20*scale,10*scale,4*scale,-.45,0,Math.PI*2);ctx.fill();ctx.fillStyle=color;for(let i=0;i<5;i++){const angle=i*Math.PI*2/5;ctx.beginPath();ctx.ellipse(Math.cos(angle)*9*scale,-49*scale+Math.sin(angle)*9*scale,6*scale,9*scale,angle,0,Math.PI*2);ctx.fill();}ctx.fillStyle='#ffd75a';ctx.beginPath();ctx.arc(0,-49*scale,5*scale,0,Math.PI*2);ctx.fill();ctx.restore();}

    function drawCardBackground(ctx, themeIndex) {
      const [deep, mid, glow, paper] = cardThemes[themeIndex];
      const sky=ctx.createLinearGradient(0,0,0,1200);sky.addColorStop(0,paper);sky.addColorStop(.48,glow);sky.addColorStop(1,'#e8f5ce');ctx.fillStyle=sky;ctx.fillRect(0,0,900,1200);
      const sunX=[690,190,735,300,610][themeIndex%5],sunY=[210,270,170,230,310][themeIndex%5];
      const sunGlow=ctx.createRadialGradient(sunX,sunY,24,sunX,sunY,310);sunGlow.addColorStop(0,'rgba(255,255,213,.96)');sunGlow.addColorStop(.32,glow+'bb');sunGlow.addColorStop(1,glow+'00');ctx.fillStyle=sunGlow;ctx.fillRect(sunX-320,sunY-320,640,640);
      ctx.fillStyle='#fff4a8';ctx.beginPath();ctx.arc(sunX,sunY,54,0,Math.PI*2);ctx.fill();
      drawCloud(ctx,175+(themeIndex%4)*32,315,.85,.76);drawCloud(ctx,710-(themeIndex%3)*35,410,.63,.7);
      const mountainColors=['#c0dfb3','#b6e1cf','#c9e4b4','#b7dedf','#d5e9aa'];
      ctx.fillStyle=mountainColors[themeIndex%5];ctx.beginPath();ctx.moveTo(0,660);ctx.lineTo(0,565);ctx.lineTo(160,430);ctx.lineTo(270,555);ctx.lineTo(440,390);ctx.lineTo(620,570);ctx.lineTo(755,445);ctx.lineTo(900,590);ctx.lineTo(900,720);ctx.closePath();ctx.fill();
      if(themeIndex%4===1||themeIndex%4===3){ctx.fillStyle='rgba(111,202,218,.8)';ctx.beginPath();ctx.moveTo(0,690);ctx.bezierCurveTo(210,640,300,745,485,696);ctx.bezierCurveTo(650,650,760,715,900,674);ctx.lineTo(900,1200);ctx.lineTo(0,1200);ctx.closePath();ctx.fill();for(let i=0;i<7;i++){ctx.strokeStyle='rgba(255,255,255,.38)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(90+i*122,785+i%3*20);ctx.quadraticCurveTo(180+i*95,770+i%2*34,260+i*90,790+i%3*18);ctx.stroke();}}
      else{drawHill(ctx,'rgba(107,194,127,.84)',675,58,themeIndex*.62);drawHill(ctx,'rgba(64,169,120,.68)',770,70,themeIndex*.47+1.4);}
      if(themeIndex%5===2||themeIndex%5===4){for(let i=0;i<13;i++)drawFlower(ctx,35+i*72,1060+(i%3)*30,.65+(i%3)*.12,['#ff96aa','#fff4df','#fbac6f','#d6a8f2'][i%4]);}
      ctx.save();ctx.globalAlpha=.2;for(let i=0;i<7;i++)drawLeaf(ctx,35+i*145,905+(i%3)*45,.48+(i%2)*.17,-.5+i*.15,'#4dab7b');ctx.restore();
      ctx.fillStyle='rgba(35,90,76,.94)';roundRect(ctx,55,50,790,108,30);
      ctx.fillStyle='rgba(255,255,255,.79)';roundRect(ctx,55,250,790,800,42);
      ctx.strokeStyle='rgba(255,255,255,.96)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(98,251);ctx.arcTo(844,251,844,1049,42);ctx.arcTo(844,1049,56,1049,42);ctx.arcTo(56,1049,56,251,42);ctx.arcTo(56,251,844,251,42);ctx.closePath();ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.82)';
      for(let i=0;i<28;i++){const x=(i*197+themeIndex*59)%900,y=(i*311+themeIndex*97)%1200;ctx.beginPath();ctx.arc(x,y,1+(i%3),0,Math.PI*2);ctx.fill();}
    }

    function wrapCanvasText(ctx, text, maxWidth) {
      const lines=[]; let line='';
      for(const character of text){if(line&&ctx.measureText(line+character).width>maxWidth){lines.push(line);line=character;}else line+=character;}
      if(line)lines.push(line);return lines;
    }

    function renderShareCard(canvas, themeIndex, progress=1) {
      const ctx=canvas.getContext('2d');
      drawCardBackground(ctx,themeIndex);
      if(cardLogo.complete&&cardLogo.naturalWidth){const maxW=275,maxH=76,scale=Math.min(maxW/cardLogo.naturalWidth,maxH/cardLogo.naturalHeight);ctx.drawImage(cardLogo,85,65,cardLogo.naturalWidth*scale,cardLogo.naturalHeight*scale);}
      ctx.textAlign='right';ctx.fillStyle='#fff9e9';ctx.font='600 25px "Klee One",serif';ctx.fillText(todayLabel(),810,115);
      ctx.textAlign='center';ctx.fillStyle='#ec7c45';ctx.font='600 30px "Klee One",serif';ctx.fillText('給今天的你',450,214);
      const verse=`「${liveVerse}」`.slice(0,Math.ceil(`「${liveVerse}」`.length*progress));
      let fontSize=50;ctx.textAlign='left';ctx.font=`600 ${fontSize}px "Klee One", "DFKai-SB", serif`;
      let lines=wrapCanvasText(ctx,verse,660);if(lines.length>8){fontSize=42;ctx.font=`600 ${fontSize}px "Klee One", "DFKai-SB", serif`;lines=wrapCanvasText(ctx,verse,660);}
      const lineHeight=fontSize*1.72;let y=365;ctx.fillStyle='#21483f';
      for(const line of lines){ctx.fillText(line,120,y);y+=lineHeight;}
      if(progress>=1){
        y+=12;ctx.textAlign='right';ctx.fillStyle='#6b8174';ctx.font='600 30px "Klee One", "DFKai-SB", serif';ctx.fillText(`— ${liveVerseReference}`,780,y);
        y+=66;ctx.textAlign='left';ctx.fillStyle='#ba7047';ctx.font='600 27px "Klee One", "DFKai-SB", serif';ctx.fillText('今日祝福',120,y);
        y+=48;ctx.fillStyle='#405b50';ctx.font='400 26px "Klee One", "DFKai-SB", serif';
        for(const line of wrapCanvasText(ctx,livePrayer,660).slice(0,5)){ctx.fillText(line,120,y);y+=43;}
      }
      ctx.textAlign='center';ctx.fillStyle='#255a4c';ctx.font='600 34px "Klee One", "DFKai-SB", serif';ctx.fillText(church==='SHiNE'?'火樂教會':'M+大雅教會',450,1110);
      ctx.fillStyle='#557a6e';ctx.font='500 19px "Klee One",serif';ctx.fillText('願主的話，成為你今天腳前的燈。',450,1150);
    }

    function animateCard(themeIndex) {
      cancelAnimationFrame(cardAnimationFrame);
      const textLength=Math.max(1,`「${liveVerse}」`.length),start=performance.now(),duration=Math.min(3800,Math.max(1500,textLength*72));
      const frame=now=>{const progress=Math.min(1,(now-start)/duration);renderShareCard(sharePreview,themeIndex,progress);if(progress<1)cardAnimationFrame=requestAnimationFrame(frame);};
      cardAnimationFrame=requestAnimationFrame(frame);
    }

    function openCardComposer() {
      currentTheme=Math.floor(Math.random()*cardThemes.length);
      shareDialog.hidden=false;document.body.style.overflow='hidden';
      animateCard(currentTheme);closeShareDialog.focus();
    }

    function closeCardComposer() {shareDialog.hidden=true;document.body.style.overflow='';cancelAnimationFrame(cardAnimationFrame);shareButton.focus();}

    async function uploadShareImage(image) {
      const response=await fetch(LINE_MEMBER_ENDPOINT,{method:'POST',headers:{'content-type':'application/json'},cache:'no-store',credentials:'omit',signal:AbortSignal.timeout(30000),body:JSON.stringify({action:'share_image',church,idToken:window.liff?.getIDToken?.()||'',image})});
      const data=await response.json().catch(()=>({}));if(!response.ok||data.ok!==true)throw new Error(data.error||'upload_failed');return data.url;
    }

    async function shareGrace() {
      openCardComposer();
    }

    async function sendShareCard() {
      sendCardButton.disabled=true;sendCardButton.textContent='正在準備圖卡…';
      try {
        renderShareCard(sharePreview,currentTheme,1);
        const blob=await new Promise(resolve=>sharePreview.toBlob(resolve,'image/jpeg',.9));
        if(!blob)throw new Error('image_unavailable');
        if(liffReady&&window.liff?.isInClient?.()&&window.liff?.isApiAvailable?.('shareTargetPicker')){
          const dataUrl=await new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(blob);});
          const url=await uploadShareImage(dataUrl);
          const result=await window.liff.shareTargetPicker([{type:'image',originalContentUrl:url,previewImageUrl:url}]);
          if(result){showToast('恩典圖卡已分享，願祝福同行 💛');closeCardComposer();}
          else showToast('已取消分享');
          return;
        }
        const file=new File([blob],'today-grace-card.jpg',{type:'image/jpeg'});
        if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file]});closeCardComposer();return;}
        const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='給今天的你-經文圖卡.jpg';link.click();URL.revokeObjectURL(link.href);showToast('圖卡已下載，可以從相簿分享 ✨');
      } catch(error) {
        console.error('Share card failed',error);showToast(error.message==='rate_limited'?'製作次數已達上限，請稍後再試':'圖卡分享暫時無法使用，請稍後再試');
      } finally {sendCardButton.disabled=false;sendCardButton.textContent='📤 分享給好友';}
    }

    function downloadShareCard() {
      renderShareCard(sharePreview,currentTheme,1);
      sharePreview.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='給今天的你-經文圖卡.jpg';link.click();URL.revokeObjectURL(url);showToast('圖卡已下載 ✨');},'image/jpeg',.9);
    }

    async function fetchTodayContent(idToken) {
      const response = await fetch(LINE_MEMBER_ENDPOINT, {
        method: 'POST',
        headers: {'content-type':'application/json'},
        cache: 'no-store',
        credentials: 'omit',
        signal: AbortSignal.timeout(20000),
        body: JSON.stringify({action:'content', feature:'today', church, idToken})
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || data.ok !== true || !data.item) throw new Error(data.error || 'content_unavailable');
      liveVerse = data.item.scripture || todayVerse;
      liveVerseReference = data.item.scripture_ref || todayVerseReference;
      livePrayer = data.item.prayer_text || todayPrayer;
      profileName = data.profile?.name || profileName;
    }

    async function initLiff() {
      if (church) {
        const config = lineConfig(`?church=${encodeURIComponent(church)}&feature=today`);
        LIFF_ID = LIFF_ID || config.liffId;
        $('#churchLabel').textContent = brandNames[church];
        $('#homeLink').href = `line-member.html?church=${encodeURIComponent(church)}&feature=menu`;
      }
      if (!church || !LIFF_ID || !window.liff) {
        $('#lineState').textContent = '今日恩典';
        return;
      }
      try {
        await window.liff.init({ liffId: LIFF_ID });
        if (!window.liff.isLoggedIn()) {
          window.liff.login({redirectUri: location.href});
          return;
        }
        const idToken = window.liff.getIDToken() || '';
        if (!idToken) throw new Error('missing_token');
        await fetchTodayContent(idToken);
        liffReady = true;
        $('#lineState').textContent = `${profileName} · 今日恩典`;
      } catch {
        $('#lineState').textContent = '稍後再來領受今天的恩典';
      }
    }

    envelopeButton.addEventListener('click', revealGrace);
    speakButton.addEventListener('click', speakGrace);
    receiveButton.addEventListener('click', () => {
      navigator.vibrate?.(35);
      releaseHearts(receiveButton);
      receiveButton.textContent = '💛 已收下，願平安與你同在';
      receiveButton.disabled = true;
      showToast('這份恩典已放進心裡');
    });
    shareButton.addEventListener('click', shareGrace);
    closeShareDialog.addEventListener('click',closeCardComposer);
    shareDialog.addEventListener('click',event=>{if(event.target===shareDialog)closeCardComposer();});
    changeBackgroundButton.addEventListener('click',()=>{let next=Math.floor(Math.random()*cardThemes.length);if(next===currentTheme)next=(next+1)%cardThemes.length;currentTheme=next;animateCard(currentTheme);});
    downloadCardButton.addEventListener('click',downloadShareCard);
    sendCardButton.addEventListener('click',sendShareCard);
    window.addEventListener('keydown',event=>{if(event.key==='Escape'&&!shareDialog.hidden)closeCardComposer();});
    window.addEventListener('pagehide', stopSpeaking);

    createParticles();
    await initLiff();
    envelopeButton.disabled = false;
  </script>

<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>M+ 本週週報</title>
<style>
:root{--forest:#164d42;--green:#246b5b;--orange:#ff762f;--cream:#f7f5ed;--ink:#203c35;--muted:#64736e;--line:#dce7df;--paper:#fff;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Noto Sans TC",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.8 var(--font)}.hero{padding:48px max(22px,calc((100vw - 1120px)/2));background:linear-gradient(125deg,var(--forest),#537f68);color:#fff}.eyebrow{font-size:.78rem;letter-spacing:.22em;font-weight:850;color:#ffdab5}.hero h1{margin:12px 0;font-size:clamp(2rem,6vw,4.5rem);line-height:1.15}.hero p{margin:0;color:#ecf4ed}.wrap{max-width:1000px;margin:30px auto;padding:0 20px 64px}.status{margin:0 0 18px;padding:12px 16px;border-radius:14px;background:#fff4e5;color:#8a4d1d}.article{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:clamp(20px,5vw,54px);box-shadow:0 16px 44px #193e3312}.article-head{padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid var(--line)}.article-head h2{margin:0 0 6px;font-size:clamp(1.55rem,4vw,2.4rem);line-height:1.35}.meta{margin:0;color:var(--muted);font-size:.9rem}.content>*:first-child{margin-top:0}.content h2,.content h3,.content h4{line-height:1.45;color:var(--forest);margin:1.7em 0 .55em}.content p{margin:.75em 0;white-space:pre-wrap}.content ul,.content ol{padding-left:1.6em}.content li{padding-left:.2em;margin:.35em 0}.content blockquote{margin:1.2em 0;padding:14px 18px;border-left:4px solid var(--orange);background:#fff8ef;border-radius:0 14px 14px 0}.content table{width:100%;border-collapse:collapse;margin:1.2em 0;font-size:.94rem}.content td,.content th{border:1px solid var(--line);padding:10px 12px;vertical-align:top;text-align:left}.content tr:first-child td{background:#f1f7f3;font-weight:800}.content a{color:#176b5b;text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}.content img{max-width:100%;height:auto;border-radius:14px}.content hr{border:0;border-top:1px solid var(--line);margin:1.6em 0}.source{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:20px;color:var(--muted);font-size:.86rem}.source a{color:var(--green);font-weight:750}@media(max-width:600px){.hero{padding:34px 22px}.wrap{padding:0 12px 38px;margin:16px auto}.article{border-radius:20px;padding:20px 17px}.content table{display:block;overflow-x:auto;white-space:normal}.content td,.content th{min-width:100px;padding:8px}}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;margin:1em 0}.gallery img{width:100%;height:220px;object-fit:cover;border-radius:14px}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;margin:1em 0}.gallery img{width:100%;height:220px;object-fit:cover;border-radius:14px}</style><style>html,body{overflow-x:hidden!important;overflow-y:hidden!important}@media(max-width:768px){html,body{overflow-y:visible!important}.status{display:block;min-height:52px}}</style></head><body><header class="hero"><div class="eyebrow">M+ CHURCH · WEEKLY</div><h1>本週週報</h1><p>每週聚會的消息、主日流程與共同代禱，陪我們一起預備心、歡迎回家。</p></header><main class="wrap"><p class="status" id="status" role="status">正在載入最新週報…</p><article class="article" id="article" hidden><header class="article-head"><h2 id="title"></h2><p class="meta" id="meta"></p></header><div class="content" id="content"></div><div class="source"><span>內容同步自教會週報</span><a id="sourceLink" target="_blank" rel="noopener">查看 Wix 原文 ↗</a></div></article></main>
<script>
const SOURCE_URL='https://daya.mchurch.online/weekly';
function reportHeight(){requestAnimationFrame(()=>window.parent.postMessage({type:'weekly-resize',height:Math.ceil(document.documentElement.scrollHeight)},'*'))}
function addInline(parent,node){if(node.href){const a=document.createElement('a');a.href=node.href;a.target='_blank';a.rel='noopener';a.textContent=node.text;parent.append(a);return}const el=node.bold?document.createElement('strong'):node.italic?document.createElement('em'):document.createTextNode(node.text);if(el.nodeType===1)el.textContent=node.text;parent.append(el)}
function renderNode(node){let el;switch(node.type){case'HEADING':el=document.createElement('h'+Math.max(2,Math.min(4,node.level||2)));break;case'BULLETED_LIST':el=document.createElement('ul');break;case'ORDERED_LIST':el=document.createElement('ol');break;case'LIST_ITEM':el=document.createElement('li');break;case'TABLE':el=document.createElement('table');break;case'TABLE_ROW':el=document.createElement('tr');break;case'TABLE_CELL':el=document.createElement('td');break;case'GALLERY':el=document.createElement('div');el.className='gallery';break;case'DIVIDER':el=document.createElement('hr');return el;case'IMAGE':if(node.src){el=document.createElement('img');el.src=node.src;el.alt=node.alt||'';el.loading='lazy';return el}return null;case'BLOCKQUOTE':el=document.createElement('blockquote');break;case'TEXT':el=document.createElement('span');addInline(el,node);return el;default:el=document.createElement('p')}
if(node.children?.length)node.children.forEach(child=>{const childEl=renderNode(child);if(childEl)el.append(childEl)});else if(node.text)el.textContent=node.text;return el}
function showError(message){const status=document.querySelector('#status');status.textContent=message+' 請先查看 Wix 原文。';const a=document.createElement('a');a.href=SOURCE_URL;a.target='_blank';a.rel='noopener';a.textContent=' 開啟週報';status.append(a)}
window.addEventListener('message',event=>{const message=event.data||{};if(message.type==='weekly-error'){showError(message.message||'週報暫時無法載入。');reportHeight();return}if(message.type!=='weekly-data'||!message.weekly)return;const post=message.weekly;document.querySelector('#title').textContent=post.title||'本週週報';document.querySelector('#meta').textContent=post.publishedAt?new Date(post.publishedAt).toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric'}):'最新發布';const content=document.querySelector('#content');content.replaceChildren(...(post.blocks||[]).map(renderNode).filter(Boolean));if(!content.childElementCount){showError('來源文章內容格式暫時無法辨識。');reportHeight();return}const source=document.querySelector('#sourceLink');source.href=post.link||post.sourceUrl||SOURCE_URL;document.querySelector('#status').hidden=true;document.querySelector('#article').hidden=false;reportHeight();setTimeout(reportHeight,250);setTimeout(reportHeight,900);setTimeout(reportHeight,1800)});
new ResizeObserver(reportHeight).observe(document.body);
window.addEventListener('load',reportHeight);
window.parent.postMessage({type:'weekly-ready'},'*');
</script>
<script>
(() => {
  let lastHeight = 0;
  const reportHeight = () => {
    const height = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
    if (height !== lastHeight) {
      lastHeight = height;
      window.parent.postMessage({ type: 'mplus-embed-resize', height }, '*');
    }
  };
  window.addEventListener('load', reportHeight);
  window.addEventListener('resize', reportHeight);
  new ResizeObserver(reportHeight).observe(document.documentElement);
  setTimeout(reportHeight, 100);
  setTimeout(reportHeight, 600);
})();
</script>
</body></html>

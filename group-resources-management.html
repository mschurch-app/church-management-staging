<!doctype html>
<html lang="zh-Hant">
<head>
<link rel="icon" type="image/svg+xml" href="assets/app/church-os-icon.svg?v=20261003-glass1">
<link rel="shortcut icon" href="assets/app/church-os-icon.svg?v=20261003-glass1">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>小組教材｜教會 OS</title>
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="church-brand.css?v=20261008-header1">
<link rel="stylesheet" href="theme-vitality.css">
<link rel="stylesheet" href="apple-ui.css">
<link rel="stylesheet" href="church-palette.css?v=20261012-readable2">
<link data-app-consistency="1" rel="stylesheet" href="app-consistency.css?v=20261022-experience4">
<script src="mplus-theme.js?v=20261020-flat1">
</script>
<link data-mplus-theme rel="stylesheet" href="mplus-theme.css?v=20261022-experience4">
<link rel="stylesheet" href="operations-workspace.css?v=20261023-operations1">
</head>
<body data-app-layout="operations" data-operations-page="group-resources-management" data-action-feedback="off">
<main class="member-page">
<header class="page-header">
<div>
<p class="eyebrow">M＋大雅教會 · 小組教材</p>
<h1>小組教材</h1>
<p class="muted">新增、修改及發佈每週小組教材；完整內文會直接呈現在教會網站。</p>
</div>
<a class="header-action" href="admin-dashboard.html?church=M%2B">返回管理首頁</a>
</header>
<p id="status" role="status" class="status-message">正在載入…</p>
<section class="operations-query">
<label>搜尋教材<input id="search" type="search" placeholder="標題、日期或簡介">
</label>
<label>顯示狀態<select id="filter-state">
<option value="all">全部教材</option>
<option value="draft">草稿</option>
<option value="published">公開</option>
<option value="archived">封存但公開</option>
</select>
</label>
<button id="reload" type="button" class="secondary">重新載入</button>
<p id="count" role="status">
</p>
</section>
<div class="cms">
<aside class="panel">
<div class="actions">
<h2>教材清單</h2>
<button data-write id="new" type="button">＋新增</button>
</div>
<div id="items" class="items">
</div>
</aside>
<section id="editor" class="panel" hidden>
<div class="actions editor-head">
<div>
<p class="eyebrow">教材內容</p>
<h2 id="form-title">編輯教材</h2>
</div>
<span id="form-mode" class="status-badge">正在編輯</span>
</div>
<form id="form" class="form">
<input id="id" type="hidden">
<div class="row">
<label>日期<input id="date" type="date" required>
</label>
<label>狀態<select id="state">
<option value="draft">草稿</option>
<option value="published">公開</option>
<option value="archived">封存但公開</option>
</select>
</label>
</div>
<label>標題<input id="title" maxlength="160" required>
</label>
<label>簡介（選填）<input id="excerpt" maxlength="300">
</label>
<label>完整內文（可貼入段落與基本 HTML）<textarea id="content" required>
</textarea>
</label>
<label>圖片網址（選填）<input id="image" type="url">
</label>
<div class="actions">
<button id="save" type="submit">儲存修改</button>
<button id="cancel" type="button" class="secondary">關閉編輯</button>
<button id="delete" class="secondary" type="button">刪除</button>
</div>
</form>
</section>
</div>
</main>
<script src="vendor/supabase-2.102.0.js">
</script>
<script type="module" src="group-resources-management.mjs?v=20261023-operations1">
</script>
<script type="module" src="church-brand.mjs?v=20261028-players1">
</script>
</body>
</html>

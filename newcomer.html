<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>新朋友登記｜測試站</title><link rel="stylesheet" href="auth.css"></head><body><main style="max-width:620px"><p>獨立測試環境 · 請使用虛構姓名與電話</p><h1 id="title">新朋友登記</h1><nav><a href="?church=M%2B">M+ 登記</a> · <a href="?church=SHiNE">火樂登記</a></nav><p>歡迎認識我們！填寫後由同工接待與跟進，不需要先登入。</p><form id="registration"><label>姓名（必填）<input name="name" maxlength="80" required autocomplete="off"></label><label>聯絡電話<input name="phone" type="tel" maxlength="40" autocomplete="off"></label><label>居住地區<input name="district" maxlength="100"></label><label>生日<input name="birthday" type="date"></label><label>性別<input name="gender" maxlength="40"></label><label>年齡層<input name="age_group" maxlength="40"></label><label>如何認識教會<input name="source" maxlength="300"></label><label>想讓同工知道的事<textarea name="note" maxlength="2000"></textarea></label><button id="submit" disabled>送出登記</button></form><p id="status" role="status"></p><p>此測試表單只建立新朋友紀錄，不會自動取得既有會員資料修改權限，也不發送群組通知。</p></main><script type="module" src="newcomer-ui.mjs"></script></body></html>

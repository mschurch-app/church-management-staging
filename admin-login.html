<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#ad3c2a"><meta http-equiv="refresh" content="0;url=admin-login-v2.html"><link rel="manifest" href="app.webmanifest?v=20261007-login-v2"><link rel="icon" href="assets/app/church-os-icon.svg?v=20261003-glass1"><link rel="apple-touch-icon" sizes="192x192" href="assets/app/church-os-icon-192.png?v=20261002-brand1"><meta name="robots" content="noindex,nofollow"><title>登入教會 OS</title><link rel="stylesheet" href="auth.css?v=20260923-aurora1"><link rel="stylesheet" href="church-brand.css?v=20261003-context1"><link rel="stylesheet" href="theme-vitality.css?v=20261003-blue1">
<link rel="stylesheet" href="apple-ui.css?v=20260924-app1"><link rel="stylesheet" href="church-palette.css?v=20261009-app-audit2"><link data-app-consistency="1" rel="stylesheet" href="app-consistency.css?v=20261009-app-audit2"></head>
<body class="auth-entry-body">
<script>location.replace('admin-login-v2.html'+location.search+location.hash);</script>
<main class="login-app">
  <section class="login-visual" aria-hidden="true"><span class="login-glow one"></span><span class="login-glow two"></span><div class="login-mark">M<span>＋</span></div><p>CHURCH MANAGEMENT</p><h2>讓服事與關懷<br>更靠近每一個人</h2></section>
  <section class="login-panel">
    <div class="login-badge">教會管理系統</div>
    <h1>歡迎回來</h1>
    <p class="muted">使用你的教會 OS 帳號登入；畫面會依身分顯示可使用的堂會與功能。</p>
    <form id="form" class="login-form">
      <label for="email">電子郵件<input id="email" type="email" autocomplete="username" placeholder="name@example.com" required></label>
      <label for="password">密碼<input id="password" type="password" autocomplete="current-password" placeholder="請輸入密碼" required></label>
      <p id="status" role="status" aria-live="polite" class="app-status"></p>
      <button id="submit" type="submit">登入管理首頁 <span aria-hidden="true">→</span></button>
    </form>
    <a class="forgot-password" href="admin-password-reset.html">忘記密碼？寄送重設信</a>
    <a class="forgot-password" href="login-recovery.html">登入沒有反應？修復登入</a>
    <p class="login-note">帳號與權限由系統安全管理</p>
  </section>
</main>
<script>
window.adminLoginReady=false;
const adminLoginForm=document.querySelector('#form'),adminLoginStatus=document.querySelector('#status'),adminLoginButton=document.querySelector('#submit'),adminLoginButtonLabel=adminLoginButton.innerHTML;
const resetAdminLogin=()=>{adminLoginButton.disabled=false;adminLoginButton.removeAttribute('aria-busy');adminLoginButton.removeAttribute('data-running');adminLoginButton.innerHTML=adminLoginButtonLabel;};
adminLoginForm.addEventListener('submit',async event=>{event.preventDefault();if(adminLoginButton.dataset.running==='1')return;adminLoginButton.dataset.running='1';adminLoginButton.disabled=true;adminLoginButton.setAttribute('aria-busy','true');adminLoginButton.textContent='正在啟動登入服務…';adminLoginStatus.textContent='請稍候，正在連接教會 OS。';try{const started=Date.now();while(typeof window.performAdminLogin!=='function'&&Date.now()-started<12000)await new Promise(resolve=>setTimeout(resolve,100));if(typeof window.performAdminLogin!=='function')throw new Error('登入程式未成功啟動（L01），請重新整理後再試。');const navigating=await window.performAdminLogin();if(navigating){window.setTimeout(()=>{adminLoginStatus.textContent='頁面未能切換，請再按一次登入。';resetAdminLogin();},8000);return;}resetAdminLogin();}catch(error){adminLoginStatus.textContent=error.message||'暫時無法登入，請稍後再試。';resetAdminLogin();}});
window.addEventListener('error',event=>{if(!(event.target instanceof HTMLScriptElement))return;const source=event.target.src||'';if(!source.includes('/vendor/supabase-2.102.0.js'))return;adminLoginStatus.textContent='登入核心程式載入失敗（L02），請重新整理後再試。';resetAdminLogin();},{capture:true});
window.setTimeout(()=>{if(window.adminLoginReady)return;adminLoginStatus.textContent='登入程式載入逾時（L03），請重新整理後再試。';resetAdminLogin();},12000);
</script>
<script src="vendor/supabase-2.102.0.js?v=20261007-local1"></script><script type="module" src="admin-login.mjs?v=20261009-stage1"></script>
<script type="module" src="church-brand.mjs?v=20261009-app-audit2"></script>
<script type="module" src="app-pwa.mjs?v=20261009-app-audit2"></script></body></html>

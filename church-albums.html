<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>相簿｜教會 OS</title><link rel="icon" href="assets/app/church-os-icon.svg"><link rel="stylesheet" href="app-design-tokens.css?v=20261009-stage2"><link rel="stylesheet" href="app-consistency.css?v=20261022-experience4"><link rel="stylesheet" href="church-albums.css?v=20261027-drivefix1"></head><body><main class="albums-shell"><header class="albums-header"><a href="mplus-dashboard.html?church=M%2B&center=admin">‹ 返回行政</a><p class="eyebrow">M+ · 教會 OS</p><h1>相簿</h1><p>收藏一起走過的日常</p></header><section aria-label="相簿分類" class="album-categories"><button data-app-control="custom" type="button" data-category="church" aria-pressed="true"><span data-icon="home"></span><strong>教會相簿</strong><small>聚會、活動與教會生活</small></button><button data-app-control="custom" type="button" data-category="school" aria-pressed="false"><span data-icon="mplus-book"></span><strong>課輔相簿</strong><small>學習、陪伴與孩子的成長</small></button></section><section class="album-workspace"><nav id="breadcrumbs" aria-label="相簿資料夾路徑"></nav><div class="album-toolbar"><h2 id="folder-title">教會相簿</h2><div><button data-app-control="custom" type="button" id="refresh">重新讀取</button><button data-app-control="custom" type="button" id="new-folder" disabled>新增資料夾</button><button data-app-control="custom" type="button" id="upload-photos" disabled>上傳照片</button><button data-app-control="custom" type="button" id="upload" disabled>上傳檔案</button></div></div><p id="status" role="status" aria-live="polite">正在確認登入…</p><a id="login" href="admin-login.html" hidden>登入教會 OS</a><section id="google-setup" hidden aria-label="相簿 Google 連線"><h3>連接相簿</h3><p>使用 mbot@tcsc.org.tw 完成一次 Google 授權即可。Google 會要求讀取此帳號可存取的雲端硬碟檔案，以及建立與管理本應用程式的檔案；教會 OS 後端仍只允許操作指定的教會與課輔相簿。</p><div class="dialog-actions"><button data-app-control="custom" type="button" id="connect-google">連接 Google 相簿</button></div><p id="setup-status" role="status"></p></section><div id="files" class="album-grid" aria-label="相簿內容"></div><button data-app-control="custom" type="button" id="more" hidden>載入更多</button></section></main><dialog id="folder-dialog"><form id="folder-form"><h2>新增資料夾</h2><label>資料夾名稱<input id="folder-name" maxlength="120" required autocomplete="off"></label><p id="folder-status" role="status"></p><div class="dialog-actions"><button data-app-control="custom" type="button" data-close>取消</button><button data-app-control="custom" type="submit">建立</button></div></form></dialog><dialog id="upload-dialog"><form id="upload-form"><h2 id="upload-title">上傳檔案</h2><p>儲存到目前的相簿資料夾，每個檔案上限 20 MB。</p><label>選擇檔案<input id="upload-files" type="file" multiple required></label><label>說明（選填）<textarea id="caption" maxlength="1000" placeholder="可以留白，直接上傳"></textarea></label><p id="upload-status" role="status" aria-live="polite"></p><div class="dialog-actions"><button data-app-control="custom" type="button" data-close>取消</button><button data-app-control="custom" type="submit">開始上傳</button></div></form></dialog><dialog id="preview-dialog"><button data-app-control="custom" type="button" data-close aria-label="關閉照片">關閉</button><h2 id="preview-title"></h2><img id="preview-image" alt="" hidden><p id="preview-status" role="status"></p><p id="preview-caption"></p></dialog><script src="vendor/supabase-2.102.0.js"></script><script type="module" src="church-albums.mjs?v=20261027-drivefix1"></script></body></html>

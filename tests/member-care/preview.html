<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/line-member.css"><link rel="stylesheet" href="/member-prayer-form.css"><title>代禱與個人靈修｜隔離預覽</title></head><body><main class="line-app"><div class="content"><p>隔離預覽：使用合成資料，不會傳送或寫入正式資料。</p><div id="prayer"></div><div id="reading"></div></div></main><script type="module">
import {mountMemberPrayerForm} from '/member-prayer-form.mjs';import {mountDailyReading} from '/member-daily-reading.mjs';
window.calls=[];window.failPrayer=false;window.loadFails=false;window.saved=null;
mountMemberPrayerForm(document.querySelector('#prayer'),{send:async value=>{calls.push(value);if(window.failPrayer)throw Error('測試連線中斷，請重試同一筆。');return {ok:true,id:100,audience:value.audience};}});
window.mountReading=()=>mountDailyReading(document.querySelector('#reading'),{date:'2026-11-19',passages:'合成讀經範圍｜詩篇 23 篇',record:window.saved,history:window.saved?[window.saved]:[],loadChapters:async()=>{if(window.loadFails)throw Error();return [{title:'合成經文試讀',verses:['耶和華是我的牧者，我必不致缺乏。']}];},saveJournal:async value=>{window.journalCalls=(window.journalCalls||[]).concat(value);return window.saved={reading_date:value.date,note:value.note,completed_at:value.complete?'2026-11-19T00:00:00Z':window.saved?.completed_at||null,revision:(window.saved?.revision||0)+1};}});window.reading=window.mountReading();
</script></body></html>

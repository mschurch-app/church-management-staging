<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>協會 FB 安全連線｜教會 OS</title><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="app-design-tokens.css"><link rel="stylesheet" href="association-stories.css?v=20261116-stories1"><style>main{max-width:620px;margin:40px auto;padding:24px}label{display:grid;gap:12px;margin:24px 0}input[type=password]{min-height:48px;font:inherit;width:100%;box-sizing:border-box}button{min-height:48px;font:inherit}#status{white-space:pre-wrap}</style></head><body><main><section class="story-panel"><h1>協會 FB 安全連線</h1><p>只連結「社團法人台灣基督教社會關懷協會」。此設定入口限時、只能使用一次。</p><p id="status" role="status" aria-live="polite">請貼入協會專頁的發布授權，憑證會直接加密保存在教會 OS。</p><form id="connection-form"><label>協會專用發布授權<input id="page-token" type="password" autocomplete="new-password" required></label><label class="story-check"><input id="consent" type="checkbox" required><span>同意將協會專用發布授權加密保存在教會 OS，供師母審核後發布與核對結果使用。</span></label><button type="submit">驗證並安全連線</button></form></section></main><script type="module" src="association-connection.mjs?v=20261116-auth-hub1"></script></body></html>

<!doctype html>
<html lang="zh-Hant">
<head>
  <link rel="icon" type="image/svg+xml" href="assets/app/church-os-icon.svg?v=20261003-glass1">
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
  <title>Instagram 發布設定｜教會 OS</title>
  <link rel="stylesheet" href="auth.css?v=20260923-aurora1"><link rel="stylesheet" href="church-brand.css?v=20261003-context1">
  <link rel="stylesheet" href="theme-vitality.css?v=20261003-blue1"><link rel="stylesheet" href="apple-ui.css?v=20260924-app3"><link rel="stylesheet" href="church-palette.css?v=20261003-contrast1">
  <style>
    .ig-connect-card{max-width:760px;margin:28px auto;padding:clamp(24px,5vw,42px);border:1px solid rgba(22,76,67,.14);border-radius:28px;background:#fff;box-shadow:0 20px 60px rgba(24,50,44,.08)}
    .ig-status{display:flex;gap:16px;align-items:center;padding:18px;border-radius:20px;background:#f3f8f5;margin:22px 0}.ig-status-mark{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:#173f38;color:#fff;font-weight:800}.ig-status strong,.ig-status span{display:block}.ig-status span{margin-top:4px;color:#5f706c}.ig-token{display:grid;gap:9px;margin:24px 0}.ig-token textarea{min-height:132px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.ig-actions{display:flex;gap:12px;flex-wrap:wrap}.ig-note{font-size:.92rem;color:#667873;line-height:1.7}.ig-connected .ig-status-mark{background:#1c765f}
  </style>
</head>
<body><main class="member-page">
  <header class="page-header"><div><p class="eyebrow">WEBSITE · SOCIAL PUBLISHING</p><h1>Instagram 發布設定</h1><p class="muted">連結 M+ 大雅教會 Instagram，供週報核准後發布 Reel。</p></div></header>
  <nav class="page-nav"><a id="back" href="church-settings.html?church=M%2B">返回系統設定</a></nav>
  <p id="status" class="status-message" role="status">正在檢查連線狀態…</p>
  <section class="ig-connect-card">
    <div id="connection" class="ig-status"><span class="ig-status-mark">IG</span><div><strong>尚未連結</strong><span>請輸入 Meta 產生的存取權杖。</span></div></div>
    <form id="connect-form">
      <label class="ig-token"><strong>Instagram 存取權杖</strong><textarea id="access-token" required autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="在此貼上 Meta 產生的存取權杖"></textarea></label>
      <p class="ig-note">權杖只會送到教會 OS 後端驗證並加密保存；儲存後不會再次顯示完整內容。</p>
      <div class="ig-actions"><button id="connect" type="submit">驗證並安全連結</button><button id="disconnect" type="button" class="secondary" hidden>中斷連結</button></div>
    </form>
  </section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0/dist/umd/supabase.js"></script><script type="module" src="instagram-publishing-settings.mjs?v=20261008-access-deadline1"></script><script type="module" src="church-brand.mjs?v=20261008-ios1"></script></body>
</html>

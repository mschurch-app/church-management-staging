<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>LINE 六功能預覽｜教會管理測試站</title>
  <link rel="stylesheet" href="line-preview.css?v=20260923-3">
<link rel="stylesheet" href="apple-ui.css?v=20260924-app1"></head>
<body>
  <main class="preview-workspace">
    <aside class="preview-controls" aria-label="預覽控制">
      <div class="preview-intro">
        <span class="preview-kicker">LINE MEMBER EXPERIENCE</span>
        <h1>六個功能頁面預覽</h1>
        <p>這裡模擬會友從 LINE 圖文選單開啟後看到的手機畫面。所有內容均為測試資料，不會送出訊息或寫入會員資料。</p>
      </div>
      <div class="church-switch" id="church-switch" aria-label="切換堂會"></div>
      <nav class="feature-switch" id="feature-switch" aria-label="切換功能"></nav>
      <div class="preview-note"><strong>預覽模式</strong><span>按鈕可操作，送出只會在畫面內顯示結果。</span></div>
    </aside>

    <section class="phone-stage" aria-label="手機頁面預覽">
      <div class="phone-frame">
        <div class="phone-status" aria-hidden="true"><span>7:54</span><span class="phone-island"></span><span>▮▮▮ 5G 🔋</span></div>
        <header class="line-bar">
          <button class="line-back" type="button" aria-label="返回圖文選單">‹</button>
          <img id="church-logo" alt="">
          <div><strong id="church-name"></strong><span id="page-context">LINE 會員服務</span></div>
          <button class="line-more" type="button" aria-label="更多選項">•••</button>
        </header>
        <div id="feature-view" class="feature-view" aria-live="polite"></div>
        <footer class="safe-area"><span></span></footer>
      </div>
    </section>
  </main>
  <script type="module" src="line-preview.mjs?v=20260923-3"></script>
</body>
</html>

</style></head><body><main class="member-page">
<header class="page-header"><div><p class="eyebrow">MEDIA · PUBLISHING</p><h1>媒體自動化與發布</h1><p class="muted">每一種產生與發布工作各自控制。關閉單一項目不會影響其他平台。</p></div></header>
<nav class="page-nav"><a id="back" href="church-settings.html?church=M%2B">返回系統設定</a></nav><p id="status" class="status-message" role="status">正在載入設定…</p>
<form id="form" class="media-settings" hidden>
  <section class="media-card"><div class="media-card-head"><div><h2>內容產生</h2><p>管理每週講道內容整理；即使關閉發布，仍可保留審核稿。</p></div></div>
    <label class="media-switch"><span class="media-switch-copy"><strong>自動整理主日講道</strong><span>分析直播，產生講題、大綱、重點與 IG 文案草稿</span></span><span class="switch"><input id="sermon-analysis" type="checkbox"><span aria-hidden="true"></span></span></label>
  </section>
  <section class="media-card"><div class="media-card-head"><div><h2>Instagram</h2><p>每種 Instagram 發布獨立開關，所有內容仍須完成既有審核。</p></div></div>
    <label class="media-switch"><span class="media-switch-copy"><strong>主日講道貼文</strong><span>講道內容核准後發布圖片與文字</span></span><span class="switch"><input id="instagram-sermon" type="checkbox"><span aria-hidden="true"></span></span></label>
    <label class="media-switch"><span class="media-switch-copy"><strong>週報 Reel</strong><span>週報核准後發布已產生的 Reel</span></span><span class="switch"><input id="instagram-weekly" type="checkbox"><span aria-hidden="true"></span></span></label>
    <label class="media-switch"><span class="media-switch-copy"><strong>平日 Reel</strong><span>允許平日經文、講道延伸及聚會邀請內容進入發布流程</span></span><span class="switch"><input id="instagram-weekday" type="checkbox"><span aria-hidden="true"></span></span></label>
    <label class="media-switch"><span class="media-switch-copy"><strong>節慶 Reel</strong><span>允許復活節、母親節、聖誕節等節慶內容進入發布流程</span></span><span class="switch"><input id="instagram-holiday" type="checkbox"><span aria-hidden="true"></span></span></label>
  </section>
  <section class="media-card"><div class="media-card-head"><div><h2>YouTube</h2><p>字幕上傳獨立控制；關閉後仍可整理講道與準備字幕草稿。</p></div></div>
    <label class="media-switch"><span class="media-switch-copy"><strong>講道字幕上傳</strong><span>字幕完成並核准後上傳至教會 YouTube 頻道</span></span><span class="switch"><input id="youtube-captions" type="checkbox"><span aria-hidden="true"></span></span></label>
  </section>
  <section class="media-card"><div class="media-card-head"><div><h2>平台連線</h2><p>開關與帳號連線分開管理；未連線時不會發布。</p></div></div><div class="connection-list">
    <div class="connection-row"><div class="connection-copy"><strong>Instagram</strong><span id="instagram-connection">正在檢查…</span></div><span id="instagram-badge" class="connection-badge">未連線</span><a class="secondary" href="instagram-publishing-settings.html?church=M%2B">管理連線</a></div>
    <div class="connection-row"><div class="connection-copy"><strong>YouTube</strong><span id="youtube-connection">正在檢查…</span></div><span id="youtube-badge" class="connection-badge">未連線</span><a class="secondary" href="youtube-settings.html?church=M%2B">管理連線</a></div>
  </div></section>
  <div class="settings-actions"><button id="reload" type="button" class="secondary">重新載入</button><button id="save" type="submit">儲存發布設定</button></div>
</form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0/dist/umd/supabase.js"></script><script type="module" src="media-publishing-settings.mjs?v=20261005-1"></script><script type="module" src="church-brand.mjs?v=20261006-inventory1"></script></body></html>

  <script>
    const home="https://james8308.wixsite.com/website-3";
    const old={about:"https://daya.mchurch.online/blank-2",faith:"https://daya.mchurch.online/blank-5",team:"https://daya.mchurch.online/blank-3",myc:"https://daya.mchurch.online/%E9%9D%92%E5%B9%B4%E6%95%99%E6%9C%83-myouthchurch",weekly:"https://daya.mchurch.online/weekly",contact:"https://daya.mchurch.online/blank-6"};
    const teamImages=["https://static.wixstatic.com/media/93e849_5f1f1370c5f943e1af56f31eb76f7ad6~mv2.png/v1/crop/x_306,y_0,w_1836,h_1836/fill/w_450,h_450,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/IMG_9521_HEIC.png","https://static.wixstatic.com/media/93e849_2c109534211541d9b65aa4f8363a7a02~mv2.jpg/v1/crop/x_392,y_735,w_335,h_335/fill/w_450,h_450,al_c,lg_1,q_80,enc_avif,quality_auto/S__69132324.jpg","https://static.wixstatic.com/media/93e849_977c22a4f4c9487abda74a871e8bec66~mv2.jpg/v1/crop/x_0,y_0,w_1536,h_1536/fill/w_450,h_450,al_c,q_80,usm_0.66_1.00_0.01,enc_avif,quality_auto/alice.jpg"];
    const pages={
      about:{title:"教會異象與歷史",lead:"我們是 M+ CHURCH。教會異象、經文與歷史內容依照原網站完整保留。",body:`<div class="vision-grid"><article class="vision-card"><span class="eyebrow">教會異象</span><h2>我們是 Ｍ＋ＣＨＵＲＣＨ !</h2><p>（Mission 有國度使命的教會、Ｍinister 樂於服事的教會、Motivation 充滿動力的教會）。</p><h3>作困苦流離者的牧人</h3><b>馬太福音9:35-38</b><blockquote>耶穌 走遍各城各鄉 ，在會堂裡 教訓（教導）人 ， 宣講天國的福音 ，又 醫治各樣的病症 。<br>他看見許多的人，就憐憫他們；因為他們困苦流離，如同羊沒有牧人一般。<br>於是 對門徒說 ：要收的莊稼多，做工的人少。<br>所以，你們當求莊稼的主 打發工人 出去 收他的莊稼 。</blockquote><p>面向世界 ： 教導真理、傳揚福音 、 醫治病症</p><p>面向教會 ： 建造門徒 、 差派工人、出去收割莊稼</p></article><article class="vision-card"><span class="eyebrow">我們的故事</span><h2>教會歷史</h2><div class="timeline"><div class="time-item"><span class="time-dot">起初</span><p>起初大雅上楓教會因位於台中市大雅區上楓里而起名。</p></div><div class="time-item"><span class="time-dot">1996</span><p>大雅上楓位於台中豐原、神岡、大雅區中心中間交界地帶，長年來無教會設立。1996年感動開拓同工們看見大雅上楓地區福音之需要，在禱告中尋求神的心意並且為當地福音工作代禱。</p></div><div class="time-item"><span class="time-dot">2011</span><p>經過五年的尋求與禱告，同工們於2011年1月開始尋找教會開拓地點與聚會場所，於2011年2月開始洽談大雅區上楓里民生路四段151-2號一樓店面，約25坪之教會會堂地點，並經由同工會決定2011年3月正式簽約租期一年。<br>同年十月教會因空間不足，由原開拓地點搬遷至台中市大雅區上楓里民生路四段141號，一年過後因著人數增長、租約到期，搬遷到大雅市區學府路138號，服事範圍也擴及整個大雅區。</p></div><div class="time-item"><span class="time-dot">2015</span><p>2015年11月教會再度因著聚會空間的不足，再次挪移帳幕到現今位置：大雅區神林南路641巷1號1樓（藍鵲大樓）。</p></div><div class="time-item"><span class="time-dot">2022</span><p>2022年12月31日因房東不續租，故暫時搬遷到同棟2樓關懷協會課輔班教室聚會，維持一年之久。2023年12月上帝帶領教會尋得合適會堂（台中市大雅區神林南路513巷13號），並於2024年1月開始裝潢施工。<br>2024/3/31由寇紹恩牧師主理現堂感恩禮拜。<br>2026年3月正式更名為Ｍ＋大雅教會。<br>我們期盼神使用教會成為大雅地區的祝福，並且被神建造成為大雅地區的金燈臺、照亮全地。<br>​我們的故事還沒有結束，等你加入我們，一起來寫屬於我們的故事....</p></div></div></article></div>`},
      faith:{title:"我們的信仰宣告",lead:"我們以聖經為信仰與生活的根基，在真理、恩典與盼望中同行。",body:`<div class="faith-list"><div class="faith-row"><strong>聖經</strong><p>我們相信聖經新舊約都是神所默示的，是基督徒信仰最高權威。</p></div><div class="faith-row"><strong>上帝</strong><p>我們相信聖父、聖子、聖靈，三位一體的獨一真神，祂創造、護理、掌管天地萬有。</p></div><div class="faith-row"><strong>基督</strong><p>我們相信耶穌是神的獨生子，祂是真神、也是真人。道成肉身來到世間為拯救世人，為世人的罪釘死在十字架上，三天後復活、升天進到榮耀裡，將還要再降臨。</p></div><div class="faith-row"><strong>人類</strong><p>我們相信人是按照神的形象所造，與神相交、被神祝福。但因著人的犯罪墮落與神斷絕交通。惟有信靠耶穌得以與神和好、稱義，依靠聖靈過得勝的生活，並且重獲神的祝福與豐盛。</p></div><div class="faith-row"><strong>教會</strong><p>教會是基督的身體，是由神的兒女所建造而成。基督是教會的頭，神的兒女彼此成全、各盡其職建立基督的身體。</p></div><div class="faith-row"><strong>末世</strong><p>世界末了，耶穌基督將審判活人與死人。信徒必永遠在主面前敬拜、相交，不信者必離開主面受永遠的滅亡。新天新地充滿神的同在、喜樂與榮耀。</p></div></div>`},
      team:{title:"服事團隊",lead:"認識陪伴教會、家庭與下一代一起成長的牧者與同工。",body:`<div class="team-grid"><article class="team-card"><img src="${teamImages[0]}" alt="吳俊璋牧師與謝碧鳳師母"><div class="team-info"><h3>吳俊璋牧師<br>謝碧鳳師母</h3><p>主任牧師、師母</p></div></article><article class="team-card"><img src="${teamImages[1]}" alt="邵鈺庭姐妹"><div class="team-info"><h3>邵鈺庭姐妹</h3><p>青年教會輔導<br>牧師辦公室</p></div></article><article class="team-card"><img src="${teamImages[2]}" alt="曾恩茹姐妹"><div class="team-info"><h3>曾恩茹姐妹</h3><p>青年教會輔導<br>小太陽課輔</p></div></article></div>`},
      myc:{title:"青年教會｜MYC",lead:"保留原有 MYC 宣傳影片與照片，使用原網站媒體來源。",body:`<div class="media-layout"><div class="media-card"><video controls playsinline preload="metadata" poster="https://static.wixstatic.com/media/93e849_bcd46010a11f46b2acee408571dfa186f000.jpg/v1/fill/w_974,h_582,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/93e849_bcd46010a11f46b2acee408571dfa186f000.jpg"><source src="https://video.wixstatic.com/video/11062b_30be9a53236643b0814ae38d90c9fbb3/720p/mp4/file.mp4" type="video/mp4"><source src="https://video.wixstatic.com/video/93e849_bcd46010a11f46b2acee408571dfa186/360p/mp4/file.mp4" type="video/mp4"></video></div><div class="media-still"><img src="https://static.wixstatic.com/media/93e849_01c5cb4f6cf748d2a21c64048fe8620b~mv2.jpg/v1/crop/x_0,y_166,w_1526,h_894/fill/w_990,h_580,q_85/S__47431703.jpg" alt="青年教會原頁照片"></div></div><div class="actions"><a class="btn btn-hot" href="https://instagram.com/m_plus_young_" target="_blank" rel="noreferrer">前往青年教會 Instagram　↗</a></div>`},
      weekly:{title:"電子週報",lead:"週報文章由原站 CMS 即時提供；點擊下方按鈕進入原週報頁，保留文章、分享與更新功能。",body:`<div class="panel"><div class="notice">電子週報包含每週主日程序、報告事項、代禱事項、主日服事與奉獻資訊。這些內容持續由原網站更新，請從原週報頁查看最新資料。</div><div class="actions"><a class="btn btn-hot" href="${old.weekly}" target="_blank" rel="noreferrer">開啟電子週報　↗</a></div></div>`},
      contact:{title:"與我們聯絡",lead:"原頁的聯絡方式、社群連結與提交表單保留；表單仍由原網站處理。",body:`<div class="contact-grid"><article class="panel"><span class="eyebrow">M+ 大雅教會</span><h2>與我們聯絡</h2><div class="contact-line"><a href="tel:0425658977">電話　04 2565 8977</a><a href="mailto:church@tcsc.org.tw">Email　church@tcsc.org.tw</a><a href="https://maps.google.com/?cid=12263144570484868639" target="_blank" rel="noreferrer">Google 地圖　↗</a><a href="https://youtube.com/user/dayasfchurch" target="_blank" rel="noreferrer">YouTube　↗</a><a href="https://facebook.com/shangfengchurch" target="_blank" rel="noreferrer">Facebook　↗</a><a href="https://line.me/ti/g/2lVfjkaema" target="_blank" rel="noreferrer">LINE　↗</a></div></article><article class="panel"><h2>聯絡表單</h2><iframe class="embed-frame" title="原網站聯絡表單" src="${old.contact}" loading="lazy"></iframe><p class="lead">若表單無法在預覽視窗顯示，<a href="${old.contact}" target="_blank" rel="noreferrer"><u>請開啟原聯絡頁</u></a>填寫。</p></article></div>`}
    };
    const key=new URLSearchParams(location.search).get('page')||'about';const page=pages[key]||pages.about;document.title=`M+ 大雅教會｜${page.title}`;const main=document.querySelector('#main');const active=document.querySelector(`[data-page="${key}"]`);if(active)active.setAttribute('aria-current','page');

<script>
(() => {
  let lastHeight = 0;
  const reportHeight = () => {
    const height = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
    if (height !== lastHeight) {
      lastHeight = height;
      window.parent.postMessage({ type: 'mplus-embed-resize', height }, '*');
    }
  };
  window.addEventListener('load', reportHeight);
  window.addEventListener('resize', reportHeight);
  new ResizeObserver(reportHeight).observe(document.documentElement);
  setTimeout(reportHeight, 100);
  setTimeout(reportHeight, 600);
})();
</script>

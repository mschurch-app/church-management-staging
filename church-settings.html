<!doctype html>
<html lang="zh-Hant">
<head><link rel="icon" type="image/svg+xml" href="assets/app/church-os-icon.svg?v=20261003-glass1"><link rel="shortcut icon" href="assets/app/church-os-icon.svg?v=20261003-glass1">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>教會設定｜教會 OS</title>
  <link rel="stylesheet" href="auth.css?v=20260923-aurora1">
<link rel="stylesheet" href="church-brand.css?v=20261008-header1"><link rel="stylesheet" href="theme-vitality.css?v=20261003-blue1">
<link rel="stylesheet" href="apple-ui.css?v=20260924-app3"><link rel="stylesheet" href="church-palette.css?v=20261009-app-audit2"><link rel="stylesheet" href="mobile-layout-fixes.css?v=20261008-nav1"><link data-app-consistency="1" rel="stylesheet" href="app-consistency.css?v=20261009-stage4"></head>
<body>
<main class="member-page settings-page">
  <header class="page-header">
    <div>
      <p class="eyebrow">CHURCH MANAGEMENT · 教會管理系統</p>
      <h1 id="title">教會設定</h1>
      <p class="muted">集中管理表單選項、帳號權限、外觀與堂會公開資訊。</p>
    </div>
  </header>
  <section class="settings-search function-finder" aria-label="搜尋設定工具">
    <label for="settings-search">找設定</label>
    <input id="settings-search" type="search" placeholder="輸入同工、初審、通知、週報…" autocomplete="off">
    <p id="settings-search-state" class="muted" role="status" hidden></p>
  </section>
  <p id="hub-status" role="status" class="status-message"></p>
  <div class="settings-layout">
    <nav id="settings-directory" class="settings-directory" aria-label="設定分類"></nav>
    <section id="settings-tools" class="settings-groups" aria-label="設定與工具"></section>
  </div>
  <section id="church-public-info" class="editor-panel settings-panel" hidden aria-labelledby="church-info-title">
    <form id="form">
      <h3 id="church-info-title">堂會資訊</h3><p id="public-info-state" class="muted"></p><h4>外觀</h4>
      <div class="edit-grid">
        <label>堂會代表色<div class="color-input"><input id="color-picker" type="color"><input id="brand-color" required maxlength="7" pattern="#[0-9A-Fa-f]{6}" placeholder="#F97316"></div></label>
        <label>Logo 圖片網址<input id="logo-url" type="url" placeholder="https://..."></label>
      </div>
      <h4>聚會與位置</h4>
      <div class="edit-grid">
        <label>聚會資訊<textarea id="service-info" placeholder="聚會時間、場次與簡要說明"></textarea></label>
        <label>地址<textarea id="address" placeholder="教會地址"></textarea></label>
        <label class="full-width">Google Maps 或地圖網址<input id="map-url" type="url" placeholder="https://..."></label>
      </div>
      <p id="status" role="status" class="status-message"></p>
      <div class="editor-actions"><button id="reload" type="button" class="secondary">重新載入</button><button id="save" type="submit">儲存教會設定</button></div>
    </form>
  </section>
</main>

<script src="vendor/supabase-2.102.0.js"></script>
<script type="module" src="church-settings-ui.mjs?v=20261009-stage4"></script>
<script type="module" src="church-brand.mjs?v=20261009-stage4"></script>
</body>
</html>

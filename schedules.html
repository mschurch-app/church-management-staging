<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>服事排班｜教牧管理</title>
  <link rel="stylesheet" href="auth.css?v=20260923-aurora1">
  <link rel="stylesheet" href="church-brand.css?v=20260923-brand1">
  <link rel="stylesheet" href="theme-milktea.css?v=20260923-milktea4">
  <link rel="stylesheet" href="schedules.css?v=20260923-1">
</head>
<body>
  <main class="member-page schedule-page">
    <header class="page-header schedule-hero">
      <div>
        <p class="eyebrow">CHURCH MANAGEMENT · 教會管理系統</p>
        <h1 id="title">服事排班</h1>
        <p class="muted">清楚安排每一位同工，一起預備美好的聚會。</p>
      </div>
      <button id="new">＋ 新增排班</button>
    </header>
    <nav class="page-nav">
      <a id="members" href="members.html">會友名冊</a>
      <a class="current" href="schedules.html?church=M%2B">M＋排班</a>
      <a href="schedules.html?church=SHiNE">火樂排班</a>
    </nav>
    <section class="schedule-export" aria-labelledby="export-title">
      <div class="export-intro">
        <span class="export-icon" aria-hidden="true">✦</span>
        <div><p class="eyebrow">LINE READY · PNG</p><h2 id="export-title">製作服事分享圖</h2><p>選擇週次或月份，直接輸出適合傳到 LINE 群組的精美圖片。</p></div>
      </div>
      <div class="export-actions">
        <label>本週聚會<select id="weekPick" aria-label="選擇週次"></select></label>
        <button id="weekPng" class="export-button"><span>本週</span>輸出 PNG</button>
        <label>月份<input id="monthPick" type="month" aria-label="選擇月份"></label>
        <button id="monthPng" class="export-button"><span>本月</span>輸出 PNG</button>
      </div>
    </section>
    <p id="status" role="status" class="status-message"></p>
    <section id="editor" class="editor-panel" hidden></section>
    <section class="schedule-heading"><div><p class="eyebrow">SERVICE TEAM</p><h2>服事安排</h2></div><span id="rangeNote"></span></section>
    <section id="records" class="schedule-list"></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0/dist/umd/supabase.js"></script>
  <script type="module" src="schedules-ui.mjs?v=20260923-design3"></script>
  <script type="module" src="church-brand.mjs?v=20260923-brand3"></script>
</body>
</html>

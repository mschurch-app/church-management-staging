<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>小組聚會資源｜管理系統</title><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="theme-vitality.css"><link rel="stylesheet" href="apple-ui.css"><style>.cms{display:grid;grid-template-columns:300px 1fr;gap:18px}.panel{background:#fff;border:1px solid #d8e8e5;border-radius:22px;padding:20px}.items{display:grid;gap:8px}.item{text-align:left;padding:12px;border:1px solid #d8e8e5;border-radius:13px;background:#f5fbfa;color:#174b45}.item.active{border-color:#ff7a30;background:#fff4e9}.form{display:grid;gap:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:6px;font-weight:700}input,textarea,select{width:100%;padding:12px;border:1px solid #cbded9;border-radius:12px;font:inherit}textarea{min-height:360px;line-height:1.7}.actions{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:760px){.cms{grid-template-columns:1fr}.row{grid-template-columns:1fr}.items{grid-template-columns:repeat(2,minmax(0,1fr))}textarea{min-height:300px}}</style></head><body><main class="member-page"><header class="page-header"><div><p class="eyebrow">M+大雅教會 · 網站維護</p><h1>小組聚會資源</h1><p class="muted">新增、修改及發佈每週小組教材；完整內文會直接呈現在教會網站。</p></div><a class="header-action" href="admin-dashboard.html?church=M%2B">返回管理首頁</a></header><p id="status" class="status-message">正在載入…</p><div class="cms"><aside class="panel"><div class="actions"><h2>教材清單</h2><button id="new" type="button">＋新增</button></div><div id="items" class="items"></div></aside><section class="panel"><form id="form" class="form"><input id="id" type="hidden"><div class="row"><label>日期<input id="date" type="date" required></label><label>狀態<select id="state"><option value="draft">草稿</option><option value="published">公開</option><option value="archived">封存但公開</option></select></label></div><label>標題<input id="title" maxlength="160" required></label><label>簡介<input id="excerpt" maxlength="300"></label><label>完整內文（可貼入段落與基本 HTML）<textarea id="content" required></textarea></label><label>圖片網址<input id="image" type="url"></label><div class="actions"><button type="submit">儲存</button><button id="delete" class="secondary" type="button">刪除</button></div></form></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0/dist/umd/supabase.js"></script><script type="module" src="group-resources-management.mjs"></script></body></html>

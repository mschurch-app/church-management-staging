<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#c94732"><title>YouTube 字幕詞庫｜教會 OS</title><link rel="icon" type="image/svg+xml" href="assets/app/church-os-icon.svg?v=20261003-glass1"><link rel="stylesheet" href="auth.css?v=20260923-aurora1"><link rel="stylesheet" href="church-brand.css?v=20261003-context1"><link rel="stylesheet" href="theme-vitality.css?v=20261003-blue1"><link rel="stylesheet" href="apple-ui.css?v=20261003-readable-report1"><link rel="stylesheet" href="church-palette.css?v=20261003-contrast1"><link rel="stylesheet" href="youtube-subtitle-library.css?v=20261006-1"></head>
<body><main class="member-page subtitle-library-page"><header class="page-header"><div><p class="eyebrow">YOUTUBE · SUBTITLE LIBRARY</p><h1>YouTube 字幕詞庫</h1><p class="muted">逐集確認辨識錯字、專有名詞與講員用語。只有標示「已確認」的內容會用於之後的字幕校對。</p></div><button id="add" type="button">＋ 新增詞彙</button></header><nav class="page-nav" aria-label="字幕工具導覽"><a href="youtube-settings.html?church=M%2B">YouTube 設定</a><a href="media-publishing-settings.html?church=M%2B">媒體發布設定</a><a href="admin-dashboard.html?church=M%2B">管理首頁</a></nav><p id="status" class="status-message" role="status">正在載入字幕詞庫…</p>
<section id="content" hidden><article class="library-toolbar"><label class="episode-field">講道集數<select id="episode"></select></label><label>搜尋<input id="search" type="search" placeholder="搜尋原辨識、正確詞彙或備註"></label><label>狀態<select id="state"><option value="active">使用中</option><option value="pending">待確認</option><option value="verified">已確認</option><option value="inactive">已停用</option><option value="all">全部</option></select></label></article><section class="library-summary" aria-label="詞庫摘要"><div><strong id="total-count">0</strong><span>本集詞彙</span></div><div><strong id="pending-count">0</strong><span>待確認</span></div><div><strong id="verified-count">0</strong><span>已確認</span></div></section><section class="library-help"><strong>同工校對方式</strong><p>確認「辨識成」與「應改為」是否正確。儲存並勾選「已確認」後，這組用詞才會加入之後每週的字幕校對。</p></section><section id="items" class="knowledge-list" aria-live="polite"></section></section></main>
<dialog id="editor" class="knowledge-dialog"><form id="form" method="dialog"><header><div><p class="eyebrow">SUBTITLE TERM</p><h2 id="editor-title">新增詞彙</h2></div><button id="close" class="secondary icon-button" type="button" aria-label="關閉">×</button></header><input id="item-id" type="hidden"><div class="edit-grid"><label>類型<select id="type" required><option value="correction">錯字對照</option><option value="glossary">固定詞彙</option><option value="speaker_term">講員用語</option></select></label><label>講員（可留空）<input id="speaker" maxlength="100"></label><label id="wrong-field" class="full-width">辨識成<input id="wrong" maxlength="120" placeholder="例如：福市"></label><label class="full-width">應改為／正確詞彙<input id="correct" required maxlength="120" placeholder="例如：服事"></label><label class="full-width">備註<textarea id="note" rows="3" maxlength="500" placeholder="例如：教會用語、機構名稱或經文章節"></textarea></label></div><label class="check-row"><input id="verified" type="checkbox"><span><strong>已由同工確認</strong><small>勾選後會用於之後的字幕校對</small></span></label><label class="check-row"><input id="active" type="checkbox" checked><span><strong>啟用這筆詞彙</strong><small>取消後保留紀錄，但不再使用</small></span></label><div class="dialog-actions"><button id="cancel" class="secondary" type="button">取消</button><button id="save" type="submit">儲存詞彙</button></div></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0/dist/umd/supabase.js"></script><script type="module" src="youtube-subtitle-library.mjs?v=20261006-1"></script><script type="module" src="church-brand.mjs?v=20261006-feedback1"></script></body></html>

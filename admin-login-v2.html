<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#173f39">
  <meta name="robots" content="noindex,nofollow">
  <title>管理員登入｜教會管理系統</title>
  <link rel="icon" href="assets/app/church-os-icon.svg">
  <link rel="stylesheet" href="auth.css?v=20261007-direct1">
  <link rel="stylesheet" href="church-brand.css?v=20261007-direct1">
  <link rel="stylesheet" href="theme-vitality.css?v=20261007-direct1">
  <link rel="stylesheet" href="apple-ui.css?v=20261007-direct1">
  <link rel="stylesheet" href="church-palette.css?v=20261007-direct1">
</head>
<body class="auth-entry-body">
<main class="login-app">
  <section class="login-visual" aria-hidden="true"><span class="login-glow one"></span><span class="login-glow two"></span><div class="login-mark">M<span>＋</span></div><p>CHURCH MANAGEMENT</p><h2>讓服事與關懷<br>更靠近每一個人</h2></section>
  <section class="login-panel">
    <div class="login-badge">教會管理系統 · 登入 v2</div>
    <h1>歡迎回來</h1>
    <p class="muted">使用 LINE 或 Email 登入；兩種方式共用同一套堂會與功能權限。</p>
    <button id="line-login" class="line-login-button" type="button">使用 LINE 登入 <span aria-hidden="true">→</span></button>
    <div class="login-divider"><span>或使用 Email</span></div>
    <form id="form" class="login-form">
      <label for="email">電子郵件<input id="email" type="email" autocomplete="username" placeholder="name@example.com" required></label>
      <label for="password">密碼<input id="password" type="password" autocomplete="current-password" placeholder="請輸入密碼" required></label>
      <p id="status" role="status" aria-live="assertive" class="app-status">新版登入程式已就緒。</p>
      <button id="submit" type="submit" onclick="document.getElementById('status').textContent='已收到點擊，正在登入…'">登入管理首頁 <span aria-hidden="true">→</span></button>
    </form>
    <a class="forgot-password" href="admin-password-reset.html">忘記密碼？寄送重設信</a>
    <p class="login-note">LINE 登入會沿用既有權限；讀經生命樹與每日靈修也使用同一個 LINE 身分。</p>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0/dist/umd/supabase.js"></script>
<script>
(()=>{
  const AUTH_URL='https://aqanuwilmvdtlzuqlrau.supabase.co',KEY='sb_publishable_-on9uPxVvSaERBEpkoc_xg_CYuANexJ',STORAGE='church-staging-admin-v1';
  const form=document.getElementById('form'),button=document.getElementById('submit'),status=document.getElementById('status'),label=button.innerHTML;
  const next=new URLSearchParams(location.search).get('next')||'',callback=new URL('admin-line-callback.html',location.href);if(next)callback.searchParams.set('next',next);const lineButton=document.getElementById('line-login'),oauth=window.supabase.createClient(AUTH_URL,KEY,{auth:{storageKey:STORAGE,storage:window.localStorage,detectSessionInUrl:false,persistSession:true,autoRefreshToken:true,flowType:'pkce'}});lineButton.onclick=async()=>{if(lineButton.disabled)return;lineButton.disabled=true;status.textContent='正在開啟 LINE 安全登入…';const {error}=await oauth.auth.signInWithOAuth({provider:'custom:line-web',options:{redirectTo:callback.href,scopes:'profile'}});if(error){status.textContent='目前無法開啟 LINE 登入，請稍後再試。';lineButton.disabled=false;}};
  const request=async(url,options,timeoutMessage)=>{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{return await fetch(url,{...options,cache:'no-store',credentials:'omit',signal:controller.signal});}catch(error){if(error.name==='AbortError')throw new Error(timeoutMessage);throw new Error('無法連接登入服務，請確認網路後再試（D02）。');}finally{clearTimeout(timer);}};
  navigator.serviceWorker?.getRegistrations().then(items=>Promise.all(items.map(item=>item.unregister()))).catch(()=>{});
  if('caches'in window)caches.keys().then(keys=>Promise.all(keys.filter(key=>key.startsWith('church-os-')).map(key=>caches.delete(key)))).catch(()=>{});
  form.addEventListener('submit',async event=>{event.preventDefault();if(button.disabled)return;button.disabled=true;button.setAttribute('aria-busy','true');button.textContent='正在驗證帳號…';status.textContent='已收到點擊，正在連接教會登入服務…';try{
    const response=await request(AUTH_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'content-type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})},'登入連線逾時，請再試一次（D01）。');
    const session=await response.json().catch(()=>({}));if(!response.ok||!session.access_token||!session.user)throw new Error(response.status===400?'登入失敗，請確認帳號與密碼。':'登入服務暫時無法使用（D03）。');
    session.expires_at=session.expires_at||Math.floor(Date.now()/1000)+Number(session.expires_in||3600);localStorage.setItem(STORAGE,JSON.stringify(session));if(!(session.user.identities||[]).some(identity=>identity.provider==='custom:line-web')){location.replace('admin-line-link.html?next='+encodeURIComponent('admin-dashboard.html'));return;}status.textContent='密碼已驗證，正在確認管理權限…';button.textContent='正在載入權限…';
    const accessResponse=await request(AUTH_URL+'/rest/v1/rpc/get_my_church_access',{method:'POST',headers:{apikey:KEY,authorization:'Bearer '+session.access_token,'content-type':'application/json'},body:'{}'},'權限查詢逾時，請再試一次（D04）。');
    const grants=await accessResponse.json().catch(()=>[]);if(!accessResponse.ok||!Array.isArray(grants)||!grants.length)throw new Error('帳號已登入，但尚未取得管理權限（D05）。');
    const churches=[...new Set(grants.map(row=>row.church_id).filter(value=>value==='M+'||value==='SHiNE'))];if(!churches.length)throw new Error('帳號沒有可使用的堂會權限（D06）。');
    status.textContent='登入成功，正在開啟管理首頁…';button.textContent='登入成功，正在開啟…';location.replace('admin-dashboard.html?church='+encodeURIComponent(churches[0]));
  }catch(error){status.textContent=error.message||'登入未完成（D00）。';document.getElementById('password').value='';button.disabled=false;button.removeAttribute('aria-busy');button.innerHTML=label;}});
})();
</script>
</body>
</html>

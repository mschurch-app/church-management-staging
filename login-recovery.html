<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#173f39">
  <title>修復登入｜教會 OS</title>
  <style>
    *{box-sizing:border-box}body{display:grid;min-height:100dvh;margin:0;padding:24px;place-items:center;background:#f7f3ec;color:#352823;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.card{width:min(430px,100%);padding:34px 28px;border:1px solid #eadbd2;border-radius:28px;background:#fff;box-shadow:0 20px 60px #4e37241a}.mark{display:grid;width:54px;height:54px;margin-bottom:22px;place-items:center;border-radius:17px;background:#173f39;color:#fff;font-size:20px;font-weight:900}h1{margin:0 0 12px;font-size:28px}p{margin:0;color:#6f817d;line-height:1.7}.progress{height:8px;margin:24px 0 18px;overflow:hidden;border-radius:999px;background:#e7f2ee}.progress:after{content:"";display:block;width:45%;height:100%;border-radius:inherit;background:#c94732;animation:move 1.1s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(122%)}}a{display:none;margin-top:20px;padding:13px 16px;border-radius:14px;background:#c94732;color:#fff;text-align:center;text-decoration:none;font-weight:800}a.show{display:block}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">M＋</div>
    <h1>正在修復登入</h1>
    <p id="status" role="status" aria-live="polite">正在清除舊版程式與快取，完成後會自動回到登入頁。</p>
    <div class="progress" aria-hidden="true"></div>
    <a id="continue" href="/admin-login.html?recovered=1">繼續前往新版登入</a>
  </main>
  <script>
  (async()=>{const status=document.querySelector('#status'),link=document.querySelector('#continue');try{if('serviceWorker'in navigator){const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.map(registration=>registration.unregister()));}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(key=>key.startsWith('church-os-')).map(key=>caches.delete(key)));}status.textContent='修復完成，正在開啟新版登入頁…';location.replace('/admin-login.html?recovered='+Date.now());}catch{status.textContent='自動修復未完成，請點下方按鈕繼續。';link.classList.add('show');}})();
  </script>
</body>
</html>
